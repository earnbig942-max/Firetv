
name: Build Fire TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir project
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d project
          test -f project/settings.gradle.kts

      - name: Generate Gradle Wrapper
        working-directory: project
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew :firetv-player:app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FireTV-APK
          path: project/firetv-player/app/build/outputs/apk/debug/app-debug.apk
